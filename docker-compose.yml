services:
  # 1. MongoDB - Stores detections and chat history
  mongodb:
    image: mongo:7-jammy
    container_name: pothole_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend - FastAPI + RT-DETR Model (Render Deployment Target)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pothole_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: pothole_detection
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-120b
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ORIGINS: '["*"]'
    volumes:
      - app_uploads:/app/backend/static/uploads

  # 3. Frontend - React 19 + Vite + Nginx (Vercel Deployment Target)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: pothole_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongodb_data:
  app_uploads:
