services:
  # 1. MongoDB - Stores both detections and chat conversations
  mongodb:
    image: mongo:7-jammy
    container_name: pothole_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Full-Stack App - Unified React Frontend + FastAPI Backend + RT-DETR Model
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pothole_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # MongoDB (Only database needed)
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: pothole_detection

      # Groq LLM
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-120b

      # Cloudinary (Optional - for cloud image storage)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # CORS
      CORS_ORIGINS: '["*"]'
    volumes:
      - app_uploads:/app/backend/static/uploads

volumes:
  mongodb_data:
  app_uploads:
